<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk Like a Local</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录/注册界面 -->
<div id="authOverlay">
  <div class="auth-box">
    <div class="auth-title">Talk Like a Local</div>
    <div id="authError" class="auth-error" style="display:none"></div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="authEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="authPassword" placeholder="至少 6 位" autocomplete="current-password">
    </div>
    <div class="auth-actions">
      <button id="loginBtn" class="btn btn-primary">登录</button>
      <button id="registerBtn" class="btn btn-secondary">注册新账号</button>
    </div>
    <div id="authTip" class="auth-tip"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="appWrap" style="display:none">

<header>
  <h1>Talk Like a Local</h1>
  <div class="header-right">
    <span id="userEmail" class="user-email"></span>
    <button id="logoutBtn" class="logout-btn">退出</button>
    <div class="export-wrap">
      <button class="export-btn" id="exportToggle">数据 ▾</button>
      <div class="export-menu" id="exportMenu">
        <a href="#" id="exportJSON">导出 JSON</a>
        <a href="#" id="exportCSV">导出 CSV（Excel）</a>
        <a href="#" id="importBtn">导入 JSON</a>
      </div>
    </div>
  </div>
</header>

<input type="file" id="importFile" accept=".json" style="display:none">

<nav>
  <a href="#" class="active" data-tab="review">
    今日复习 <span class="badge" id="dueBadge">0</span>
  </a>
  <a href="#" data-tab="add">添加句子</a>
  <a href="#" data-tab="all">
    全部句子 <span class="badge" id="allBadge">0</span>
  </a>
</nav>

<main>

  <section id="tab-review" class="active">
    <div class="section-header">
      <h2>今日复习</h2>
      <span class="count" id="reviewCount"></span>
    </div>
    <div id="reviewList"></div>
  </section>

  <section id="tab-add">
    <div class="section-header"><h2>添加句子</h2></div>
    <div class="card" style="padding: 20px;">
      <form id="addForm">
        <div class="form-group">
          <label>中文句子 <span style="color:#c0392b">*</span></label>
          <textarea id="f-chinese" placeholder="输入中文意思或场景描述…" required></textarea>
        </div>
        <div class="form-group">
          <label>英文句子 <span style="color:#c0392b">*</span></label>
          <textarea id="f-english" placeholder="输入对应的英文表达…" required></textarea>
        </div>
        <div class="form-group">
          <label>视频链接（可选）</label>
          <input type="text" id="f-source-url" placeholder="粘贴链接…">
        </div>
        <div class="form-group">
          <label>时间戳（可选）</label>
          <input type="text" id="f-source-ts" placeholder="例如 2:30">
        </div>
        <div class="form-group">
          <label>关键词汇（可选，每行一个）</label>
          <textarea id="f-keywords" placeholder="circle back: 回头再讨论&#10;EOD: 下班前" style="min-height:90px"></textarea>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary">添加句子</button>
          <span class="form-notice" id="addNotice">已添加 ✓</span>
        </div>
      </form>
    </div>
  </section>

  <section id="tab-all">
    <div class="section-header">
      <h2>全部句子</h2>
      <span class="count" id="allCount"></span>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索中文或英文…">
    </div>
    <div id="allList"></div>
  </section>

</main>
</div><!-- #appWrap -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=7"></script>
</body>
</html>
